name: CI

on:
  pull_request:

jobs:
  php-tests:
    if: (!contains(github.event.head_commit.message, '[skip ci]'))
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            php: 8.2
            laravel: 11.*
            dependency-version: prefer-lowest
            testbench: ^9.2
          - os: ubuntu-24.04
            php: 8.2
            laravel: 11.*
            dependency-version: prefer-stable
            testbench: ^9.2
          - os: ubuntu-24.04
            php: 8.3
            laravel: 11.*
            dependency-version: prefer-lowest
            testbench: ^9.2
          - os: ubuntu-24.04
            php: 8.3
            laravel: 11.*
            dependency-version: prefer-stable
            testbench: ^9.2
          - os: ubuntu-24.04
            php: 8.2
            laravel: 12.*
            dependency-version: prefer-lowest
            testbench: 10.*
          - os: ubuntu-24.04
            php: 8.2
            laravel: 12.*
            dependency-version: prefer-stable
            testbench: 10.*
          - os: ubuntu-24.04
            php: 8.3
            laravel: 12.*
            dependency-version: prefer-lowest
            testbench: 10.*
          - os: ubuntu-24.04
            php: 8.3
            laravel: 12.*
            dependency-version: prefer-stable
            testbench: 10.*
          - os: ubuntu-24.04
            php: 8.3
            laravel: 13.*
            dependency-version: prefer-lowest
            testbench: ^11.0
          - os: ubuntu-24.04
            php: 8.3
            laravel: 13.*
            dependency-version: prefer-stable
            testbench: ^11.0

    runs-on: ${{ matrix.os }}

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@728c6c6b8cf02c2e48117716a91ee48313958a19 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, pdo_sqlite
          coverage: none
      - run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
      - run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Migrate phpunit schema
        run: vendor/bin/phpunit --migrate-configuration

      - name: Unit testing
        run: vendor/bin/phpunit
